spring.application.name=interviewexplainer-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/interviewexplainer
spring.datasource.username=interviewexplainer
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Let Flyway handle schema (use 'update' to auto-fix column types)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - Automatic Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Disable Spring SQL Init (Flyway handles it)
spring.sql.init.mode=never
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
management.endpoints.web.exposure.include=health,info
